<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="same-origin">
  <title>TheoremOS · 研究工作台</title>
  <link rel="icon" type="image/svg+xml" href="assets/mark.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body data-mobile-view="compose">
  <a class="skip-link" href="#main">跳到工作区</a>
  <header class="topbar">
    <button type="button" id="open-history" class="icon-button" aria-label="打开研究记录" title="研究记录"><i data-lucide="panel-left"></i></button>
    <a class="brand" href="https://likc1606.github.io/theorem-os/" aria-label="TheoremOS 官网"><img src="assets/mark.svg" alt="" width="26" height="26"><span>Theorem<span class="brand-os">OS</span></span></a>
    <span class="topbar-divider" aria-hidden="true"></span><span id="workspace-title" class="workspace-name">新研究</span>
    <div class="topbar-actions"><button type="button" id="open-settings" class="model-menu" title="研究配置" aria-haspopup="dialog"><i data-lucide="sliders-horizontal"></i><span id="current-model">模型配置</span><i data-lucide="chevron-down"></i></button><span id="connection-status" class="connection-status" role="status"><span class="status-dot"></span>连接中</span></div>
  </header>
  <main id="main" tabindex="-1">
    <div id="global-notice" class="global-notice" role="alert" hidden><i data-lucide="triangle-alert"></i><span id="global-notice-text"></span><button type="button" id="retry-connection" class="text-button"><i data-lucide="refresh-cw"></i>重新连接</button></div>
    <nav class="mobile-switch" role="tablist" aria-label="工作区视图"><button type="button" id="mobile-compose" role="tab" aria-selected="true" aria-controls="compose-panel" data-mobile-view="compose"><i data-lucide="message-square"></i>对话</button><button type="button" id="mobile-runs" role="tab" aria-selected="false" aria-controls="runs-panel" tabindex="-1" data-mobile-view="runs"><i data-lucide="panel-right"></i>工作区<span id="mobile-run-count" class="count">0</span></button></nav>
    <div class="workspace">
      <section class="composer" id="compose-panel" aria-labelledby="compose-heading">
        <div class="pane-heading composer-heading"><div><h1 id="compose-heading">研究对话</h1></div><div class="composer-actions"><button type="button" id="import-task" class="icon-button" title="导入任务草稿或运行档案" aria-label="导入任务草稿或运行档案" disabled><i data-lucide="upload"></i></button><button type="button" id="export-draft" class="icon-button" title="导出任务草稿" aria-label="导出任务草稿" disabled><i data-lucide="download"></i></button><button type="button" id="new-research" class="icon-button" title="新研究" aria-label="新研究" disabled><i data-lucide="square-pen"></i></button></div></div>
        <input type="file" id="task-file" accept=".json" hidden aria-label="选择任务草稿或运行档案"><div id="draft-error" class="draft-error inline-error" role="alert" hidden></div>
        <div id="conversation-scroll" class="chat-scroll" tabindex="0" aria-label="研究对话">
          <div id="conversation" class="chat-thread"><div class="chat-welcome"><img src="assets/mark.svg" alt="" width="40" height="40"><h2>从一道定理开始</h2></div></div>
        </div>
        <p id="conversation-announcement" class="sr-only" role="status" aria-atomic="true"></p>
        <form id="run-form" novalidate>
          <button type="button" id="latest-message" class="icon-button jump-to-latest" title="最新进展" aria-label="跳到最新进展" hidden><i data-lucide="arrow-down"></i></button>
          <fieldset id="form-fields" disabled>
            <aside id="submission-readiness" class="submission-readiness" data-state="pending" aria-label="提交准备">
              <span id="readiness-icon" class="readiness-icon" aria-hidden="true"><i data-lucide="circle-alert"></i></span>
              <div class="readiness-copy"><p id="readiness-title" role="status" aria-atomic="true">正在读取提交配置</p><p id="readiness-detail">连接后可编辑研究任务。</p></div>
              <button type="button" id="prepare-run" class="readiness-action" disabled><span id="readiness-action">查看配置</span><i data-lucide="arrow-right"></i></button>
            </aside>
            <div class="chat-input-shell">
              <div class="composer-source-row"><button type="button" id="edit-draft-source" class="source-attachment" title="编辑原始 Lean 题目"><i data-lucide="file-code-2"></i><span>Submission.lean</span><span id="attached-lines" class="mono"></span></button><span id="draft-status" class="draft-status" role="status">未保存草稿</span></div>
              <label for="task" class="sr-only">研究任务</label><textarea id="task" name="task" class="chat-input" rows="3" required spellcheck="false" aria-label="研究任务" aria-describedby="task-count task-validation" placeholder="输入研究任务…"></textarea>
              <p id="task-validation" class="field-validation task-validation" role="alert" hidden></p>
              <div class="composer-tools"><button type="button" id="attach-source" class="icon-button" aria-label="附加 Lean 文件" title="附加 Lean 文件"><i data-lucide="paperclip"></i></button><button type="button" id="composer-settings" class="icon-button" aria-label="研究配置" title="研究配置"><i data-lucide="sliders-horizontal"></i></button><span id="composer-environment" class="composer-environment"></span><span id="task-count" class="field-count mono"></span><div class="composer-send"><button type="button" id="stop-research" class="icon-button stop-button" title="取消运行" aria-label="取消运行" hidden><i data-lucide="square"></i></button><button type="submit" id="submit-run" class="icon-button send-button" title="发送研究任务" aria-label="发送研究任务" disabled><i data-lucide="arrow-up"></i></button></div></div>
            </div>
            <dialog id="run-settings" class="settings-dialog" aria-labelledby="settings-heading">
              <header class="settings-heading"><h2 id="settings-heading">研究配置</h2><button type="button" id="close-settings" class="icon-button" aria-label="关闭研究配置" title="关闭研究配置"><i data-lucide="x"></i></button></header>
              <div class="settings-content">
                <div class="form-section research-section">
                  <div class="section-heading"><i data-lucide="file-code-2"></i><h2>原始题目</h2><span class="scope-note" id="lean-scope"></span></div>
                  <label for="environment">证明环境</label><select id="environment" name="environment" required aria-describedby="environment-details environment-validation"><option value="">正在加载…</option></select>
                  <p id="environment-validation" class="field-validation" role="alert" hidden></p>
                  <p class="field-note environment-details" id="environment-details">正在读取环境版本</p>
                  <label for="template">模板</label><select id="template" name="template"><option value="">自定义 Lean</option></select>
                  <div class="label-line source-label"><label for="source">Lean 源码</label><div class="editor-actions"><button type="button" id="import-source" class="icon-button" aria-label="导入 Lean 文件" title="导入 Lean 文件"><i data-lucide="upload"></i></button><button type="button" id="expand-source" class="icon-button" aria-label="展开源码编辑器" title="展开源码编辑器"><i data-lucide="maximize-2"></i></button></div></div>
                  <input type="file" id="source-file" accept=".lean" hidden aria-label="选择 Lean 文件"><textarea id="source" name="source" class="source-input mono" rows="11" required spellcheck="false" autocapitalize="off" aria-label="Lean 源码" aria-describedby="environment-details source-count source-lines source-error source-validation"></textarea>
                  <p id="source-validation" class="field-validation" role="alert" hidden></p>
                  <div class="source-meta"><span id="source-count" class="field-count mono"></span><span id="source-lines" class="field-count"></span></div><div id="source-error" class="inline-error" role="alert" hidden></div>
                </div>
                <div class="form-section connection-section">
                  <div class="section-heading"><i data-lucide="cpu"></i><h2>模型连接</h2></div>
                  <label for="provider">服务商</label><select id="provider" name="providerId" required aria-describedby="provider-address provider-validation"><option value="">正在加载…</option></select>
                  <p id="provider-validation" class="field-validation" role="alert" hidden></p>
                  <div class="provider-address mono" id="provider-address">&nbsp;</div>
                  <div class="field-grid model-grid"><div><label for="model">模型</label><input id="model" name="model" type="text" required autocomplete="off" spellcheck="false" aria-describedby="model-validation"><p id="model-validation" class="field-validation" role="alert" hidden></p></div><div><label for="effort">推理强度</label><select id="effort" name="effort"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="xhigh">Xhigh</option></select></div></div>
                  <label for="api-key" class="credential-label">API Key</label><div class="password-field"><input id="api-key" name="apiKey" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="API Key" aria-describedby="credential-note api-key-validation"><button type="button" id="toggle-key" class="icon-button" title="显示 API Key" aria-label="显示 API Key" aria-pressed="false"><i data-lucide="eye"></i></button></div>
                  <p id="api-key-validation" class="field-validation" role="alert" hidden></p>
                  <p class="field-note" id="credential-note">密钥经服务器调用所选服务商，费用计入对应 API 账户。</p>
                </div>
                <div class="form-section execution-section">
                  <div class="section-heading"><i data-lucide="sliders-horizontal"></i><h2>执行配置</h2></div>
                  <div class="field-grid limits-grid"><div><label for="max-turns">轮次上限</label><input id="max-turns" name="maxTurns" type="number" required min="1" step="1" inputmode="numeric" aria-describedby="max-turns-validation"><p id="max-turns-validation" class="field-validation" role="alert" hidden></p></div><div><label for="max-seconds">解题预算 / 秒</label><input id="max-seconds" name="maxRunSeconds" type="number" required min="30" step="1" inputmode="numeric" aria-describedby="max-seconds-validation"><p id="max-seconds-validation" class="field-validation" role="alert" hidden></p></div><div><label for="workers">Agent 数量</label><input id="workers" name="workers" type="number" required min="1" step="1" inputmode="numeric" aria-describedby="workers-validation"><p id="workers-validation" class="field-validation" role="alert" hidden></p></div></div>
                  <fieldset class="coordination"><legend>协作模式</legend><div class="segmented"><label><input type="radio" name="coordination" value="cooperative" checked><span><i data-lucide="network"></i>任务协作</span></label><label><input type="radio" name="coordination" value="independent"><span><i data-lucide="git-branch"></i>独立并行</span></label></div></fieldset>
                </div>
              </div>
              <footer class="settings-footer"><button type="button" id="reset-form" class="text-button" disabled><i data-lucide="rotate-ccw"></i>重置配置</button><div><button type="button" id="apply-settings" class="button">完成</button><button type="submit" id="settings-submit" class="button button-primary"><i data-lucide="arrow-up"></i>开始研究</button></div></footer>
            </dialog>
          </fieldset>
          <div class="form-submit"><div id="form-error" class="inline-error" role="alert" hidden></div><span id="runtime-note" class="runtime-note" role="status">正在检查环境</span></div>
        </form>
      </section>
      <div id="pane-resizer" class="pane-resizer" role="separator" tabindex="0" aria-label="调整对话区域宽度" aria-orientation="vertical" aria-valuemin="28" aria-valuemax="60" aria-valuenow="40"></div>
      <section class="runs-workspace" id="runs-panel" aria-label="Lean 实时工作区"><section class="run-detail" id="run-detail" aria-label="运行详情"><div class="empty-state detail-empty"><span class="spinner"></span><h2>正在连接工作台</h2></div></section></section>
    </div>
  </main>
  <dialog id="history-dialog" class="history-dialog" aria-labelledby="runs-heading">
    <aside class="run-history" aria-labelledby="runs-heading">
      <div class="pane-heading"><h2 id="runs-heading">研究记录 <span class="count" id="run-count">0</span></h2><div class="composer-actions"><button type="button" id="refresh-runs" class="icon-button" title="刷新运行记录" aria-label="刷新运行记录" disabled><i data-lucide="refresh-cw"></i></button><button type="button" id="close-history" class="icon-button" aria-label="关闭研究记录" title="关闭研究记录"><i data-lucide="x"></i></button></div></div>
      <div class="history-tools"><div class="history-search"><i data-lucide="search"></i><label class="sr-only" for="run-search">搜索运行记录</label><input type="search" id="run-search" placeholder="搜索运行" maxlength="128" autocomplete="off" aria-controls="run-list"><button type="button" id="clear-run-search" class="icon-button" aria-label="清除搜索" title="清除搜索" hidden><i data-lucide="x"></i></button></div><label class="sr-only" for="run-filter">筛选运行状态</label><select id="run-filter" aria-controls="run-list"><option value="all">全部状态</option><option value="active">进行中</option><option value="passed">验收通过</option><option value="unproved">未验收通过</option><option value="cancelled">已取消</option><option value="error">运行错误</option></select></div>
      <div id="runs-error" class="history-error" role="status" hidden></div><div id="run-list" class="run-list" role="list" aria-label="运行记录"><div class="empty-state compact" role="status"><span class="spinner"></span><p>正在加载运行记录</p></div></div>
    </aside>
  </dialog>
  <dialog id="source-editor" class="source-editor" aria-labelledby="editor-heading"><header class="editor-heading"><div><h2 id="editor-heading">Lean 源码</h2><span id="editor-environment"></span></div><button type="button" id="close-editor" class="icon-button" aria-label="关闭源码编辑器" title="关闭源码编辑器"><i data-lucide="x"></i></button></header><label class="sr-only" for="expanded-source">编辑 Lean 源码</label><textarea id="expanded-source" class="expanded-source mono" spellcheck="false" autocapitalize="off" aria-describedby="editor-count editor-error"></textarea><div id="editor-error" class="inline-error" role="alert" hidden></div><footer class="editor-footer"><span id="editor-count" class="field-count mono"></span><div class="editor-footer-actions"><button type="button" id="cancel-editor" class="button">取消</button><button type="button" id="apply-editor" class="button button-primary">应用修改</button></div></footer></dialog>
  <dialog id="import-task-dialog" class="confirm-dialog import-dialog" aria-labelledby="import-heading" aria-describedby="import-description"><header class="confirm-heading"><h2 id="import-heading">导入研究任务</h2><button type="button" id="close-import" class="icon-button" aria-label="关闭导入预览" title="关闭导入预览"><i data-lucide="x"></i></button></header><div class="import-content"><p id="import-filename" class="import-filename mono"></p><p id="import-description" class="import-description">将替换当前草稿，API Key 需重新输入。</p><dl id="import-facts" class="facts import-facts"></dl><section class="import-preview"><h3>研究任务</h3><p id="import-task-preview" class="task-content"></p></section><section class="import-preview"><h3>原始 Lean 源码</h3><pre class="code-scroll" tabindex="0"><code id="import-source-preview"></code></pre></section><p id="import-notice" class="confirmation-notice" role="status" hidden></p></div><footer class="confirm-footer"><button type="button" id="cancel-import" class="button" autofocus>取消</button><button type="button" id="confirm-import" class="button button-primary"><i data-lucide="upload"></i>载入任务</button></footer></dialog>
  <dialog id="delete-run-dialog" class="confirm-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description"><header class="confirm-heading"><h2 id="delete-heading">删除运行记录</h2><button type="button" id="close-delete" class="icon-button" aria-label="关闭删除确认" title="关闭删除确认"><i data-lucide="x"></i></button></header><div class="confirm-content"><p id="delete-title" class="confirm-title"></p><p id="delete-description">记录中的源码、证明和报告将一并删除，无法恢复。</p><a id="delete-download" class="button" download><i data-lucide="download"></i>下载运行档案</a><p id="delete-notice" class="confirmation-notice" role="status" hidden></p><div id="delete-error" class="inline-error" role="alert" hidden></div></div><footer class="confirm-footer"><button type="button" id="cancel-delete" class="button" autofocus>取消</button><button type="button" id="confirm-delete" class="button button-destructive"><i data-lucide="trash-2"></i><span>删除记录</span></button></footer></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><div class="no-script">需要启用 JavaScript 才能使用研究工作台。</div></noscript>
  <script src="app.js" defer></script>
</body>
</html>
